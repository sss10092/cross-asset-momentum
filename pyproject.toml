[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-asset-momentum"
version = "1.0.0"
description = "Regime-conditioned cross-asset momentum with walk-forward validation and look-ahead tests."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Srujal Sakhala"}]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xmom = "xmom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B905", "E741", "E402", "E731"]
